<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InteliScrap AI — Offline</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4', 100: '#dcfce7', 200: '#bbf7d0', 300: '#86efac',
              400: '#4ade80', 500: '#22c55e', 600: '#16a34a', 700: '#15803d',
              800: '#166534', 900: '#14532d', 950: '#052e16',
            },
            gold: {
              50: '#fffbeb', 100: '#fef3c7', 200: '#fde68a', 300: '#fcd34d',
              400: '#fbbf24', 500: '#f59e0b', 600: '#d97706', 700: '#b45309',
              800: '#92400e', 900: '#78350f', 950: '#451a03',
            },
            slate: {
              50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0', 300: '#cbd5e1',
              400: '#94a3b8', 500: '#64748b', 600: '#475569', 700: '#334155',
              800: '#1e293b', 900: '#0f172a', 950: '#020617',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen bg-slate-50 dark:bg-slate-950 flex items-center justify-center p-4">
  <div class="max-w-md w-full text-center">
    <div class="mb-6">
      <svg class="mx-auto h-20 w-20 text-brand-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" />
      </svg>
    </div>
    
    <h1 class="text-2xl font-extrabold text-slate-900 dark:text-white mb-2">You're Offline</h1>
    <p class="text-slate-600 dark:text-slate-400 mb-6">
      InteliScrap AI works offline for core features. Some data may be cached from your last visit.
    </p>

    <div class="space-y-3 mb-6">
      <button onclick="window.location.reload()" class="w-full px-4 py-3 bg-brand-600 text-white font-semibold rounded-xl hover:bg-brand-700 transition-colors">
        Try Again
      </button>
      <button onclick="navigator.serviceWorker.controller?.postMessage({type: 'SKIP_WAITING'})" class="w-full px-4 py-3 border-2 border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 font-semibold rounded-xl hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
        Refresh App
      </button>
    </div>

    <div class="text-xs text-slate-500 dark:text-slate-400">
      <p class="mb-2">Available offline:</p>
      <ul class="text-left space-y-1 max-w-xs mx-auto">
        <li>• Material scanning & classification</li>
        <li>• Cached price matrix</li>
        <li>• Offline offer creation</li>
        <li>• Voice guides (cached)</li>
      </ul>
    </div>

    <script>
      // Auto-retry when online
      window.addEventListener('online', () => {
        window.location.reload();
      });

      // Check if service worker is ready
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.ready.then(reg => {
          console.log('SW ready:', reg.scope);
        }).catch(err => {
          console.log('SW error:', err);
        });
      }
    </script>
  </div>
</body>
</html>
